trigger:
- main
- feature/*
pool: 
 name: dhurander
parameters:
- name: checkof
  displayName: checkof tool
  type: boolean
  default: false
- name: gitleakes
  displayName: gitleaks tool
  type: boolean
  default: false
- name: tflint
  displayName: tflint tool
  type: boolean
  default: false
- name: tfsec
  displayName: tfsec tool
  type: boolean
  default: false

stages:
  - stage: checkof
    displayName: checkof
    jobs:
      - job: scan
        displayName: checkof'
        continueOnError: true
        condition: eq('${{ parameters.checkof }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'checkov -d . --soft-fail'
  - stage: tflint
    displayName: tflint
    jobs:
      - job: scan
        displayName: tflint'
        continueOnError: true
        condition: eq('${{ parameters.tflint }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              tflint --init
              tflint --force
  - stage: tfsec
    displayName: tfsec tool
    jobs:
      - job: scan
        displayName: tfsec
        continueOnError: true
        condition: eq('${{ parameters.tfsec }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec .'
  - stage: gitleakes
    displayName: gitleakes tool
    jobs:
      - job: scan
        displayName: gitleakes
        continueOnError: true
        condition: eq('${{ parameters.gitleakes }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'gitleaks detect -v'
  - stage: 
    jobs:
     -
       job: 
       steps:
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'init'
           backendServiceArm: 'data'
           backendAzureRmStorageAccountName: 'stagefile123321'
           backendAzureRmContainerName: 'tfstate'
           backendAzureRmKey: 'pt.terraform.tfstate'
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'plan'
           environmentServiceNameAzureRM: 'data'
  - stage: approvbal
    displayName: manual approval
    jobs:
      - job: 
        pool: server
        displayName: manual approval
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'ankitlodhi@gmail.com'
  - stage: apply
    jobs:
     -
       job: 
       steps:
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'init'
           backendServiceArm: 'data'
           backendAzureRmStorageAccountName: 'stagefile123321'
           backendAzureRmContainerName: 'tfstate'
           backendAzureRmKey: 'pt.terraform.tfstate'
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'plan'
           environmentServiceNameAzureRM: 'data'
       - task: TerraformTask@5
         inputs:
           provider: 'azurerm'
           command: 'apply'
           environmentServiceNameAzureRM: 'data'