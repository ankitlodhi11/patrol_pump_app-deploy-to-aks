trigger:
- main
- feature/*

parameters:
- name: scan
  displayName: scan tool
  type: boolean
  default: false

- name: tfsec
  displayName: tfsec tool
  type: boolean
  default: false
stages:
  - stage: scan
    displayName: checkof
    jobs:
      - job: scan
        displayName: checkof'
        condition: eq('${{ parameters.scan }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'checkov -d .'
  - stage: tfsec
    displayName: tfsec tool
    jobs:
      - job: scan
        displayName: tfsec
        condition: eq('${{ parameters.tfsec }}', true)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec .'
  - stage: terraform 
    displayName: init
    dependsOn:  []
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'data'
            backendAzureRmStorageAccountName: 'stagefile123321'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'pt.terraform.tfstate'
  - stage: plan 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'data'