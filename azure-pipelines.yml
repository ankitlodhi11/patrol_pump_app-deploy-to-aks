trigger:
- main
- feature/*
stages:
  - stage: scan
    displayName: scan
    jobs:
      - job: terraforminit
        displayName: terraform init
        steps:
        - task: CostGuardrails@1
          inputs:
            planPath: 'plan.json'
            skipBudget: true
            skipNarrative: true
            skipGuardrails: true
            autoApprove: true
            extraArgs: 'terraform show -json tfplan | cost-guardrails --plan -'