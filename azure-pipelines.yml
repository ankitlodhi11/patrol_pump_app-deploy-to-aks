trigger:
- main
- feature/*

parameters:
- name: scan
  displayName: infracost
  type: boolean
stages:
  # - stage: scan
  #   displayName: scan
  #   jobs:
  #     - job: terraforminit
  #       displayName: terraform init
  #       steps:
  #       - task: tfsec@1
  #         inputs:
  #           version: 'v1.26.0'
  #           debug: true
  - stage: terraform 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'data'
            backendAzureRmStorageAccountName: 'stagefile123321'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'pt.terraform.tfstate'
  - stage: plan 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'data'