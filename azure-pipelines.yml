trigger:
- main
- feature/*

parameters:
- name: scan
  displayName: infracost
  type: boolean
stages:
  - stage: scan
    displayName: scan
    jobs:
      - job: terraforminit
        displayName: terraform init
        steps:
        - task: InfracostSetup@2
          inputs:
            apiKey: 'ico-tw0oH95vMImaw1AMin9xftV66ImsBg1R'
            version: '0.10.x'
  - stage: terraform 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'data'
            backendAzureRmStorageAccountName: 'stagefile123321'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'pt.terraform.tfstate'
  - stage: plan 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'data'